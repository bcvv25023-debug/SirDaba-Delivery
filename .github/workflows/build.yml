name: Build SirDaba APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Release or Debug'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # ── 3. Flutter 3.19.x stable ─────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      # ── 4. google-services.json (من Secret) ──────────────────────────────────
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES" > android/app/google-services.json

      # ── 5. Keystore لـ signing (اختياري) ─────────────────────────────────────
      # إذا ما عندكش keystore، احذف هاد الـ step وبقى debug signing
      - name: Write keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      # ── 6. key.properties ────────────────────────────────────────────────────
      - name: Write key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.jks
          EOF

      # ── 7. pub get ───────────────────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 8. Build APK ─────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # ── 9. Upload artifact ───────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirdaba-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── 10. GitHub Release (عند push tag مثل v1.0.0) ────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: SirDaba ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
